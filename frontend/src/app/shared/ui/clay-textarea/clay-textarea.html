<div class="field" [class.has-error]="!!error()">
  @if (label()) {
    <label [for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="req">*</span>
      }
    </label>
  }
  <textarea
    [id]="id()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [value]="value"
    [disabled]="disabled"
    [attr.aria-invalid]="!!error()"
    [attr.aria-describedby]="error() ? id() + '-error' : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
  @if (error()) {
    <p class="error" [id]="id() + '-error'" role="alert">{{ error() }}</p>
  }
</div>
